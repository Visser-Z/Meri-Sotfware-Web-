<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn logo · 400×400</title>
<link rel="stylesheet" href="li.css">
<style>
  /* LinkedIn shows company logos as small as 48px, so the mark alone, generous margin, no wordmark */
  .avatar {
    width: 400px;
    height: 400px;
    background: var(--color-carbon-black);
    display: grid;
    place-items: center;
  }
  .avatar img { width: 236px; height: auto; transform: translateY(-4px); }
</style>
</head>
<body>
  <div class="avatar"><img src="../../../images/logo-mark.svg" alt="Meri.Software"></div>
</body>
</html>
